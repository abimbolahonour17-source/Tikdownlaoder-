services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your managed PostgreSQL connection}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      GETINSAVER_API_KEY: ${GETINSAVER_API_KEY:?Set GETINSAVER_API_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set your frontend origin(s)}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rq", "worker", "video-processing", "--url", "redis://redis:6379/0"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to your managed PostgreSQL connection}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?Set S3_ENDPOINT_URL}
      S3_REGION: ${S3_REGION:-auto}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Set S3_SECRET_ACCESS_KEY}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
volumes:
  redis-data:

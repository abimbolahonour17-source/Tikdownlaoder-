services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tikdownload
      POSTGRES_USER: tikdownload
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tikdownload -d tikdownload"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio-local-password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://tikdownload:${POSTGRES_PASSWORD:-local-development-password}@postgres:5432/tikdownload
      MEDIA_DIR: /data/media
      S3_BUCKET: tikdownload-media
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-local-password}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      GETINSAVER_API_KEY: ${GETINSAVER_API_KEY:-}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rq", "worker", "video-processing", "--url", "redis://redis:6379/0"]
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://tikdownload:
        ${POSTGRES_PASSWORD:-local-development-password}@postgres:5432/tikdownload
      MEDIA_DIR: /data/media
      S3_BUCKET: tikdownload-media
      S3_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minio-local-password}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
    volumes:
      - tikdownload-temp:/tmp/worker
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
  object-data:
  tikdownload-temp

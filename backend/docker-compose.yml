services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /data/media
      TIKDOWNLOAD_DB_PATH: /data/tikdownload.sqlite3
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-80}
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - tikdownload-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["rq", "worker", "video-processing", "--url", "redis://redis:6379/0"]
    environment:
      REDIS_URL: redis://redis:6379/0
      MEDIA_DIR: /data/media
      TIKDOWNLOAD_DB_PATH: /data/tikdownload.sqlite3
      MEDIA_TTL_SECONDS: ${MEDIA_TTL_SECONDS:-3600}
    volumes:
      - tikdownload-data:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  tikdownload-data:
